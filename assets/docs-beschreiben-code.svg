      <path d="M0,0 L7,4 L0,8" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="260" height="400" rx="10" fill="#0b0b0b"/>
  <text x="130" y="56" fill="#ffffff" font-size="36" font-weight="bold" text-anchor="middle">AI</text>
