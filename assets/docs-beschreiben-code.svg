  <line x1="214" y1="202" x2="214" y2="268" stroke="#ffffff" stroke-width="4" stroke-dasharray="0.1 12" stroke-linecap="round"/>
  <rect x="38" y="278" width="184" height="94" rx="8" fill="none" stroke="#ffffff" stroke-width="3"/>
