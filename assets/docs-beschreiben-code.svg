<svg xmlns="http://www.w3.org/2000/svg" width="260" height="400" viewBox="0 0 260 400" font-family="'Comic Sans MS','Segoe Print','Bradley Hand',cursive" role="img" aria-label="Die KI liest die Docs, die den darunterliegenden Code beschreiben">
